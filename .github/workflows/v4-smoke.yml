name: V4 Deterministic CI Pyramid (L1 / L2 / L3)

on:
  push:
    branches:
      - feat/v4-strict-form-motion-cloud-archive
  pull_request:
    branches: [main]

jobs:
  ci-l1:
    name: "CI-L1: Syntax, Contracts & Unit Pyramid"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python source and tests
        run: python -m compileall -q src tests
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pydantic pillow numpy pyyaml httpx beautifulsoup4 python-dotenv huggingface_hub
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Check frozen canonical contracts
        run: PYTHONPATH=. python scripts/freeze_contracts.py --check
      - name: Run CI-L1 unit & contract tests
        run: python -m pytest -m ci_l1 -q --disable-warnings

  ci-l2:
    name: "CI-L2: Integration & Pipeline Contracts"
    needs: [ci-l1]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pydantic pillow numpy pyyaml httpx beautifulsoup4 python-dotenv huggingface_hub
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Install media validators (ffmpeg/ffprobe)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg and ffprobe already installed"
          else
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
      - name: Run CI-L2 integration & contract tests
        run: python -m pytest -m ci_l2 -q --disable-warnings

  ci-l3:
    name: "CI-L3: Real FFmpeg Media, E2E & Fastpath"
    needs: [ci-l2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pydantic pillow numpy pyyaml httpx beautifulsoup4 python-dotenv huggingface_hub
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Install media validators (ffmpeg/ffprobe)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg and ffprobe already installed"
          else
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
      - name: Run CI-L3 real FFmpeg media & E2E tests
        run: python -m pytest -m ci_l3 -q --disable-warnings
