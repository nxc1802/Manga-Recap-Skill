[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-recap"
version = "5.0.0"
description = "Manga Recap V5 Slim with VieNeu-TTS and FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "requests",
    "pydantic",
    "pillow",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "beautifulsoup4",
    "vieneu>=3.8.3",
    "pytest",
    "huggingface_hub>=0.26.0",
]

[project.scripts]
manga-recap = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
