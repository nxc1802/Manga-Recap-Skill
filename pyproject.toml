[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-recap"
version = "5.0.0"
description = "Manga Recap Skill with local VieNeu-TTS and FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "requests",
    "pydantic",
    "pillow",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "beautifulsoup4",
    "vieneu>=3.8.3",
    "huggingface_hub>=0.26.0",
    "kaggle",
    "six",
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
dev = [
    "pytest",
]

[project.scripts]
manga-recap = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
