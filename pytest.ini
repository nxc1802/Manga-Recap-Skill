[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers
markers =
    ci_l1: Deterministic Level 1 unit & contract tests (schemas, VisualPlan, setup, state machine, receipts, scheduler, GPU assignment)
    ci_l2: Deterministic Level 2 integration & pipeline contract tests (script->TTS, audio->VisualPlan, VisualPlan->renderer, cloud package->sync, Dual-T4 queue->worker, HF/YouTube/cleanup)
    ci_l3: Deterministic Level 3 real FFmpeg local media, E2E, fastpath, and render integration tests
    live_l4: Live Level 4 end-to-end verification requiring real Kaggle, Hugging Face, YouTube, or Webtoons credentials (manual workflow_dispatch only)
    perf: Performance & throughput benchmark suites (PERF-P8/P9; manual workflow_dispatch only)
